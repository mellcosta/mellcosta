name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # corre todos os dias à meia-noite (UTC)
  workflow_dispatch: {} # permite correr manualmente também
  push:
    branches:
      - main # ou "master", dependendo do nome da tua branch principal

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: mellcosta
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVG to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
